<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="cadastro.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <main class="container">
        <h1>Crie sua conta aqui</h1>
        <form action="cadastro.php" method="POST">
            <div class="input-box">
                <input placeholder="Nome" type="text" name="nome" required>
            </div>
            <div class="input-box">
                <input placeholder="E-mail" type="email" name="email" required>
            </div>
            <div class="input-box">
                <input placeholder="Confirme o E-mail" type="email" name="confirma_email" required>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" name="senha" required>
            </div>
            <div class="input-box">
                <input placeholder="Confirme a Senha" type="password" name="confirma_senha" required>
            </div>
            <button type="submit" class="criar-conta">Criar Conta</button>
            <div class="registro">
                <p>Já tem conta? <a href="index.html">Fazer login</a></p>
            </div>
        </form>
    </main>
</body>
</html>
