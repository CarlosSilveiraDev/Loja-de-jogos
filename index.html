<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Player</title>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap)" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="11" x2="10" y2="11"></line>
        <line x1="8" y1="9" x2="8" y2="13"></line>
        <line x1="15" y1="12" x2="15.01" y2="12"></line>
        <line x1="18" y1="10" x2="18.01" y2="10"></line>
        <rect x="2" y="5" width="20" height="14" rx="4"></rect>
      </svg>
      Server Player
    </div>

    <nav>
      <a href="#">Início</a>
      <a href="#">Jogos</a>
      <a href="#">Promoções</a>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <main class="hero">
    <!-- Controles decorativos: desenho guardado uma vez e usado nos dois lados -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="grad-controle" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <symbol id="controle-desenho" viewBox="0 0 600 380">
    <g fill="rgba(139,92,246,.10)" stroke="url(#grad-controle)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M140 80 C190 62 230 66 260 76 L340 76 C370 66 410 62 460 80
               C520 100 560 180 575 260 C590 330 560 360 525 350
               C490 340 470 290 440 255 C420 235 400 232 380 232
               L220 232 C200 232 180 235 160 255
               C130 290 110 340 75 350 C40 360 10 330 25 260
               C40 180 80 100 140 80 Z"/>
      <path d="M150 72 C180 52 220 52 250 60" fill="none" stroke-width="9"/>
      <path d="M450 72 C420 52 380 52 350 60" fill="none" stroke-width="9"/>
      <circle cx="170" cy="148" r="30"/>
      <circle cx="170" cy="148" r="16"/>
      <path d="M232 196 h16 v-16 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 Z" transform="translate(-10 4)"/>
      <circle cx="372" cy="205" r="30"/>
      <circle cx="372" cy="205" r="16"/>
      <circle cx="430" cy="140" r="13"/>
      <circle cx="458" cy="116" r="13"/>
      <circle cx="458" cy="164" r="13"/>
      <circle cx="486" cy="140" r="13"/>
      <circle cx="300" cy="112" r="16"/>
      <circle cx="258" cy="140" r="6"/>
      <circle cx="342" cy="140" r="6"/>
    </g>
  </symbol>
</svg>

<!-- Controle da ESQUERDA -->
<div class="controle-fx controle-esquerda" aria-hidden="true">
  <svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
    <use class="corpo" href="#controle-desenho" width="600" height="380"/>
    <line class="linha-verde" x1="-50" y1="310" x2="650" y2="60" pathLength="1"/>
  </svg>
</div>

<!-- Controle da DIREITA -->
<div class="controle-fx controle-direita" aria-hidden="true">
  <svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
    <use class="corpo" href="#controle-desenho" width="600" height="380"/>
    <line class="linha-verde" x1="-50" y1="310" x2="650" y2="60" pathLength="1"/>
  </svg>
</div>
    <span class="selo">ENTREGA EM SEGUNDOS</span>

    <h1>Server Player</h1>

    <p>Sua plataforma para comprar jogos digitais com entrega instantânea, preços justos
       e uma biblioteca que nunca para de crescer.</p>

    <div class="acoes">
      <a href="login.html" class="btn btn--entrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="11" x2="10" y2="11"></line>
          <line x1="8" y1="9" x2="8" y2="13"></line>
          <line x1="15" y1="12" x2="15.01" y2="12"></line>
          <line x1="18" y1="10" x2="18.01" y2="10"></line>
          <rect x="2" y="5" width="20" height="14" rx="4"></rect>
        </svg>
        Entrar
      </a>
      <a href="#" class="btn btn--contorno">Explorar jogos</a>
    </div>
  </main>

</body>
</html>
