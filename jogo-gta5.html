<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="jogo.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 5 - ServerPlayer</title>
</head>
<body>

    <header class="topo">
        <span class="marca">Server<strong>Player</strong></span>
        <div class="topo-direita">
            <a href="home.html" class="voltar"><i class="bx bx-arrow-back"></i> Voltar à loja</a>
            <a href="perfil.html" class="icone-perfil" aria-label="Meu perfil">
                <i class="bx bxs-user-circle"></i>
            </a>
        </div>
    </header>

    <main class="detalhes">
        <div class="capa-grande">
            <img src="img/gta5.webp" alt="Capa do jogo GTA 5">
        </div>

        <div class="info">
            <span class="categoria">Ação / Mundo Aberto</span>
            <h1>GTA 5</h1>

            <div class="meta">
                <span><i class="bx bx-desktop"></i> PC, PS5, Xbox</span>
                <span><i class="bx bx-star"></i> 4.8 (2.130 avaliações)</span>
            </div>

            <p class="descricao">
                Explore Los Santos e Blaine County em uma das maiores aventuras de
                mundo aberto já criadas. Controle três criminosos diferentes e viva
                histórias entrelaçadas de assaltos, traição e sobrevivência.
            </p>

            <div class="compra">
                <span class="preco">R$ 79,90</span>
                <button type="button" class="comprar" onclick="adicionarAoCarrinho(1)">Adicionar ao carrinho</button>
            </div>
        </div>
    </main>

    <script src="jogos.js"></script>
    <script src="carrinho.js"></script>
</body>
</html>
