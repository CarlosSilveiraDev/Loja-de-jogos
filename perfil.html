<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="perfil.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - ServerPlayer</title>
</head>
<body>

    <header class="topo">

    <main class="perfil">

            <div class="avatar">
                <i class="bx bxs-user"></i>

        <section class="biblioteca">
            <h2>Minha biblioteca</h2>
            <div class="grade-jogos">
                <div class="item">
                    <img src="img/gta5.webp" alt="Capa do jogo GTA 5">

                </div>
                <div class="item">
                    <img src="img/minecraft.webp" alt="Capa do jogo Minecraft">

                </div>
